[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricetracker"
version = "0.1.0"
description = "Daily Israeli supermarket price tracking from Price Transparency Law files"
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "Moatsem Khalifa" }]
dependencies = [
  "psycopg[binary]>=3.2",
  "lxml>=5.0",
  "pandas>=2.1",
  "numpy>=1.26",
  "requests>=2.31",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
dbt = ["dbt-core>=1.10,<2", "dbt-postgres>=1.9,<2"]

[project.scripts]
pricetracker = "pricetracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
