# Credentials come from environment variables. `python -m pricetracker dbt ...`
# fills them in from DATABASE_URL in your .env, so you never edit this file.
grocery_prices:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'postgres') }}"
      schema: staging
      threads: 4
      sslmode: "{{ env_var('DBT_SSLMODE', 'prefer') }}"
