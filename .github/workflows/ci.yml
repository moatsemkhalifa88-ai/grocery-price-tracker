name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Python pipeline + dbt
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prices
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prices
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prices_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e . --no-deps
      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE prices_test"
      - name: Unit + integration tests
        run: pytest -q
      - name: Migrate and load synthetic demo data
        run: |
          python scripts/generate_demo_data.py
          python -m pricetracker migrate
          python -m pricetracker load data/demo
      - name: dbt seed + build (models and data tests)
        run: |
          python -m pricetracker dbt seed
          python -m pricetracker dbt build
      - name: Analytics jobs
        run: python -m pricetracker analytics

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL_READONLY: postgresql://build:build@localhost:5432/none
